<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الدفع | Confirmation de Paiement</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #004d99;
            --secondary: #ffcc00;
            --bg: #f8f9fa;
            --white: #ffffff;
            --text: #333;
            --danger: #dc3545;
            --success: #28a745;
            --warning: #ffc107;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }
        body { 
            margin: 0; padding: 0; 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Cairo', 'Poppins', sans-serif; 
        }

        /* Language Switcher */
        .lang-switch {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
        }
        [dir="ltr"] .lang-switch { left: auto; right: 20px; }
        
        .btn-lang {
            background: var(--primary); color: white; border: 2px solid var(--secondary);
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }

        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        
        /* Header & Logo */
        .header { text-align: center; margin-bottom: 30px; }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--secondary); margin-bottom: 10px; }
        
        /* Check Style Card */
        .check-card {
            background: var(--white); border: 2px solid var(--primary); border-radius: 15px;
            padding: 25px; position: relative; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 30px;
            background-image: radial-gradient(var(--primary) 0.5px, transparent 0.5px);
            background-size: 15px 15px; background-color: #fffdf5;
        }
        .check-card::before {
            content: "OFFICIAL"; position: absolute; top: 20px; right: -30px;
            background: rgba(0,77,153,0.05); transform: rotate(45deg);
            padding: 5px 40px; font-size: 12px; font-weight: bold;
        }

        .card { background: var(--white); padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary); }
        .form-control { 
            width: 100%; padding: 12px 15px; border: 1px solid #ddd; 
            border-radius: 8px; font-size: 15px; background: #fafafa;
        }
        .form-control:focus { border-color: var(--primary); outline: none; background: #fff; }

        .btn-submit {
            background: var(--primary); color: white; border: none; width: 100%;
            padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,77,153,0.3); }

        /* Animation Classes */
        .success-anim { display: none; text-align: center; animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Admin Styles */
        #admin-section { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-item { padding: 20px; border-radius: 12px; color: white; text-align: center; }
        
        .table-container { overflow-x: auto; background: white; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: var(--primary); color: white; padding: 15px; text-align: center; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        
        .badge-time { padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; color: white; }

        /* RTL/LTR Adjustments */
        [dir="ltr"] .form-group label { text-align: left; }
        [dir="ltr"] table th, [dir="ltr"] table td { text-align: center; }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button class="btn-lang" onclick="toggleLanguage()" id="langBtn">Français</button>
    </div>

    <div id="public-view" class="container">
        <div class="header">
            <img src="https://play-lh.googleusercontent.com/4yxUE_wg_ljg1BRyO7BQ8l3siAyQZSeGx17OKyo0Y2Htt9A5oJEC7-zW0p4opjIbWQ=w600-h300-pc0xffffff-pd" alt="Logo" class="logo-img">
            <h1 id="mainTitle">تأكيد الدفع</h1>
        </div>

        <div class="check-card">
            <h3 id="ourInfoTitle">معلومات الدفع الخاصة بنا</h3>
            <hr style="border: 0.5px dashed var(--primary); opacity: 0.3;">
            <p><strong id="lbl_ourName">الاسم الكامل:</strong> <span id="display_myName">جاري التحميل...</span></p>
            <p><strong id="lbl_ourRip">رقم الحساب RIP:</strong> <span id="display_myRip">جاري التحميل...</span></p>
            <p><strong id="lbl_ourAddr">العنوان:</strong> <span id="display_myAddr">جاري التحميل...</span></p>
        </div>

        <div class="card" id="formContainer">
            <form id="paymentForm">
                <div class="form-group">
                    <label id="lbl_formCourse">اسم الدورة</label>
                    <input type="text" id="in_course" class="form-control" required>
                </div>
                <div class="form-group">
                    <label id="lbl_formName">الاسم الكامل</label>
                    <input type="text" id="in_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label id="lbl_formPhone">رقم الهاتف</label>
                    <input type="tel" id="in_phone" class="form-control" required>
                </div>
                <div class="form-group">
                    <label id="lbl_formWilaya">الولاية</label>
                    <input type="text" id="in_wilaya" class="form-control" required>
                </div>
                <div class="form-group">
                    <label id="lbl_formCcp">رقم الحساب البريدي</label>
                    <input type="text" id="in_ccp" class="form-control" required>
                </div>
                <div class="form-group">
                    <label id="lbl_formFile">رفع إثبات الدفع (Reçu)</label>
                    <input type="file" id="in_file" class="form-control" accept="image/*" required>
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit">تأكيد الدفع</button>
            </form>
        </div>

        <div id="successMsg" class="success-anim card">
            <div style="font-size: 50px; color: var(--success);">✓</div>
            <h2 id="successTitle">تم إرسال إثبات الدفع بنجاح</h2>
            <p id="successNote" style="color: #d35400; font-weight: bold;"></p>
        </div>

        <div class="card">
            <h3 id="reportTitle" style="color: var(--danger);">الإبلاغ عن مشكل</h3>
            <form id="reportForm">
                <div class="form-group"><input type="text" id="r_name" class="form-control" placeholder="الاسم" required></div>
                <div class="form-group"><input type="email" id="r_email" class="form-control" placeholder="الإيمايل" required></div>
                <div class="form-group"><textarea id="r_desc" class="form-control" placeholder="الوصف" rows="3" required></textarea></div>
                <button type="submit" class="btn-submit" style="background: var(--danger);" id="btnReport">إرسال</button>
            </form>
        </div>
    </div>

    <div id="login-view" class="container" style="display:none; max-width: 400px; margin-top: 100px;">
        <div class="card">
            <h2 id="adminLoginTitle" style="text-align:center;">دخول الإدارة</h2>
            <input type="password" id="adminPass" class="form-control" placeholder="****">
            <button class="btn-submit" onclick="attemptLogin()" style="margin-top:15px;">Login</button>
        </div>
    </div>

    <div id="admin-section" class="container">
        <h1 id="adminDashTitle">لوحة التحكم</h1>
        <div class="stats-grid">
            <div class="stat-item" style="background: #17a2b8;"><span id="stat_new_lbl">جديدة</span>: <span id="count_new">0</span></div>
            <div class="stat-item" style="background: var(--primary);"><span id="stat_all_lbl">الكل</span>: <span id="count_all">0</span></div>
            <div class="stat-item" style="background: var(--danger);"><span id="stat_fail_lbl">فاشلة</span>: <span id="count_fail">0</span></div>
        </div>

        <div class="card table-container">
            <h3 id="tab_payments">جدول الدفعات</h3>
            <table>
                <thead>
                    <tr>
                        <th id="th_date">التاريخ</th>
                        <th id="th_course">الدورة</th>
                        <th id="th_name">الاسم</th>
                        <th id="th_phone">الهاتف</th>
                        <th id="th_status">الحالة</th>
                    </tr>
                </thead>
                <tbody id="admin_pay_body"></tbody>
            </table>
        </div>
        
        <button class="btn-lang" onclick="window.location.hash=''" style="width: 100%;">Logout</button>
    </div>

    <script>
        // --- Translations ---
        const i18n = {
            ar: {
                dir: 'rtl', langBtn: 'Français', mainTitle: 'تأكيد الدفع',
                ourInfoTitle: 'معلومات الدفع الخاصة بنا', lbl_ourName: 'الاسم الكامل:',
                lbl_ourRip: 'رقم الحساب RIP:', lbl_ourAddr: 'العنوان:',
                lbl_formCourse: 'اسم الدورة', lbl_formName: 'الاسم الكامل',
                lbl_formPhone: 'رقم الهاتف', lbl_formWilaya: 'الولاية',
                lbl_formCcp: 'رقم الحساب البريدي', lbl_formFile: 'رفع إثبات الدفع (Reçu)',
                btnSubmit: 'تأكيد الدفع', successTitle: 'تم إرسال إثبات الدفع بنجاح',
                successNote: 'سيتم التأكد من طلبكم في ظرف 24 سا إلى 48 سا ، سنتصل بكم فور التأكد من أن دفعكم صحيح',
                reportTitle: 'الإبلاغ عن مشكل', btnReport: 'إرسال الإبلاغ',
                adminDashTitle: 'لوحة التحكم', stat_new_lbl: 'دفعات جديدة',
                stat_all_lbl: 'جميع الدفعات', stat_fail_lbl: 'دفع فاشل',
                tab_payments: 'جدول الدفعات', th_date: 'التاريخ', th_course: 'الدورة',
                th_name: 'الاسم', th_phone: 'الهاتف', th_status: 'الحالة',
                status_pending: 'قيد المراجعة', status_paid: 'مدفوع', status_failed: 'فاشل'
            },
            fr: {
                dir: 'ltr', langBtn: 'العربية', mainTitle: 'Confirmation de Paiement',
                ourInfoTitle: 'Nos Informations de Paiement', lbl_ourName: 'Nom Complet:',
                lbl_ourRip: 'Numéro RIP:', lbl_ourAddr: 'Adresse:',
                lbl_formCourse: 'Nom de la Formation', lbl_formName: 'Nom Complet',
                lbl_formPhone: 'N° Téléphone', lbl_formWilaya: 'Wilaya',
                lbl_formCcp: 'Numéro de Compte (CCP)', lbl_formFile: 'Preuve de paiement (Reçu)',
                btnSubmit: 'Confirmer le Paiement', successTitle: 'Preuve envoyée avec succès',
                successNote: 'Votre demande sera vérifiée dans 24h à 48h. Nous vous contacterons dès confirmation.',
                reportTitle: 'Signaler un problème', btnReport: 'Envoyer',
                adminDashTitle: 'Tableau de Bord', stat_new_lbl: 'Nouveaux',
                stat_all_lbl: 'Total', stat_fail_lbl: 'Échoués',
                tab_payments: 'Liste des Paiements', th_date: 'Date', th_course: 'Formation',
                th_name: 'Nom', th_phone: 'Tél', th_status: 'Statut',
                status_pending: 'En attente', status_paid: 'Payé', status_failed: 'Échoué'
            }
        };

        let currentLang = 'ar';
        let myInfo = JSON.parse(localStorage.getItem('myInfo_v2')) || { name: 'بريد الجزائر / مؤسسة التدريب', rip: '007 99999 0000000000 12', address: 'الجزائر العاصمة، ساحة الشهداء' };
        let payments = JSON.parse(localStorage.getItem('payments_v2')) || [];

        function updateUI() {
            const lang = i18n[currentLang];
            document.getElementById('html-tag').dir = lang.dir;
            document.getElementById('langBtn').innerText = lang.langBtn;
            
            // Loop through translation keys
            Object.keys(lang).forEach(key => {
                const el = document.getElementById(key);
                if (el) el.innerText = lang[key];
            });

            // Specific UI Updates
            document.getElementById('display_myName').innerText = myInfo.name;
            document.getElementById('display_myRip').innerText = myInfo.rip;
            document.getElementById('display_myAddr').innerText = myInfo.address;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'fr' : 'ar';
            updateUI();
            if(window.location.hash === '#09#') renderAdmin();
        }

        // --- Navigation ---
        function checkRoute() {
            const hash = window.location.hash;
            document.getElementById('public-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('admin-section').style.display = 'none';

            if (hash === '#09#') {
                if(sessionStorage.getItem('isAdmin') === 'true') {
                    document.getElementById('admin-section').style.display = 'block';
                    renderAdmin();
                } else {
                    document.getElementById('login-view').style.display = 'block';
                }
            } else {
                document.getElementById('public-view').style.display = 'block';
            }
        }

        window.onhashchange = checkRoute;
        window.onload = () => { updateUI(); checkRoute(); };

        function attemptLogin() {
            if(document.getElementById('adminPass').value === '#abobob2026#') {
                sessionStorage.setItem('isAdmin', 'true');
                checkRoute();
            } else { alert('Error!'); }
        }

        // --- Logic ---
        document.getElementById('paymentForm').onsubmit = function(e) {
            e.preventDefault();
            const pay = {
                id: Date.now(),
                timestamp: Date.now(),
                date: new Date().toLocaleString(),
                course: document.getElementById('in_course').value,
                name: document.getElementById('in_name').value,
                phone: document.getElementById('in_phone').value,
                status: 'pending'
            };
            payments.push(pay);
            localStorage.setItem('payments_v2', JSON.stringify(payments));
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
        };

        function renderAdmin() {
            const now = Date.now();
            const tbody = document.getElementById('admin_pay_body');
            tbody.innerHTML = '';
            
            let countNew = 0, countFail = 0;

            payments.forEach(p => {
                const diffHrs = Math.floor((now - p.timestamp) / (1000 * 60 * 60));
                if(p.status === 'pending') {
                    countNew++;
                    if(diffHrs >= 48) p.status = 'failed';
                }
                if(p.status === 'failed') countFail++;

                let timeColor = '#28a745';
                if(diffHrs >= 24) timeColor = '#ffc107';
                if(diffHrs >= 48) timeColor = '#dc3545';

                const badge = p.status === 'pending' ? `<span class="badge-time" style="background:${timeColor}">${diffHrs}h</span>` : '';

                tbody.innerHTML += `
                    <tr>
                        <td>${p.date}</td>
                        <td>${p.course}</td>
                        <td>${p.name}</td>
                        <td>${p.phone}</td>
                        <td>
                            ${badge}
                            <select onchange="updateStatus(${p.id}, this.value)">
                                <option value="pending" ${p.status==='pending'?'selected':''}>${i18n[currentLang].status_pending}</option>
                                <option value="paid" ${p.status==='paid'?'selected':''}>${i18n[currentLang].status_paid}</option>
                                <option value="failed" ${p.status==='failed'?'selected':''}>${i18n[currentLang].status_failed}</option>
                            </select>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('count_all').innerText = payments.length;
            document.getElementById('count_new').innerText = countNew;
            document.getElementById('count_fail').innerText = countFail;
        }

        function updateStatus(id, newStatus) {
            const idx = payments.findIndex(x => x.id === id);
            payments[idx].status = newStatus;
            localStorage.setItem('payments_v2', JSON.stringify(payments));
            renderAdmin();
        }
    </script>
</body>
</html>
